name: Lint using Next.js with ESLint and Stylelint

on: push

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v2
              with:
                  version: 12
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
